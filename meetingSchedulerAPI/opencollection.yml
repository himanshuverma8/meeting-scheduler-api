opencollection: 1.0.0

info:
  name: meetingSchedulerAPI
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{ token }}"
  variables:
    - name: baseUrl
      value: http://localhost:3000
  scripts:
    - type: before-request
      code: |-
        const token = bru.getVar("token");
        if (token) {
          req.setHeader("Authorization", `Bearer ${token}`);
        }
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
