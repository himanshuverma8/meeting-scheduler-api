info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |+
      {"name":"Test User","email":"test1@example.com","password":"password123"}

  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("token", res.body.token);
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
